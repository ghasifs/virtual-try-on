<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>WearIT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
<link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300,700'>
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.5.9/slick.min.css'>
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.5.9/slick-theme.min.css'><link rel="stylesheet" href="./style.css">

</head>
<body>
<div class="shop-card">
  <div class="title">
    T-SHIRT
  </div>
  <div class="desc">
    WearIT Demo
  </div>
  <div class="slider">
    <figure data-color="#C5C4C4, #FFF1D8">
      <img src="images/shirt_natural.jpg" />
    </figure>
    <figure data-color="#BF9B90, #C18675">
      <img src="images/shirt_blue.jpg" />
    </figure>
    <figure data-color="#967117, #664C1A">
      <img src="images/shirt_brown.jpg" />
    </figure>
    <figure data-color="#292a2f, #131519">
      <img src="images/shirt_black.jpg" />
    </figure>
  </div>

  <div class="cta">
    <div class="price">$∞</div>
    <button class="btn">Try On<span class="bg"></span></button>
    <div class="switch-container">
      <div class="switch-item">
        <input type="radio" id="pose" name="switch" checked>
        <label for="pose" class="switch">
          <span class="slider"></span>
        </label>
        <span class="switch-label">Pose</span>
      </div>
      <div class="switch-item">
        <input type="radio" id="yolo" name="switch">
        <label for="yolo" class="switch">
          <span class="slider"></span>
        </label>
        <span class="switch-label">Yolo</span>
      </div>
      <div class="switch-item">
        <input type="radio" id="aruco" name="switch">
        <label for="aruco" class="switch">
          <span class="slider"></span>
        </label>
        <span class="switch-label">Aruco</span>
      </div>
    </div>
  </div>
</div>
<div class="bg"></div>



<a class="the-most" target="_blank" href="https://ghasifs.com/">
  <img src="images/logo.png">
</a>
  <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.5.9/slick.min.js '></script><script  src="./script.js"></script>

</body>
</html>
